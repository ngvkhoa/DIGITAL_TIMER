name: PCB Gerber Integrity Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-hardware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Gerber Verification Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gerbv unzip

      - name: Validate Gerber Production Archive
        run: |
          echo "=== Test Gerber ==="
          if [ -f "Gerber_PCB1_2026-08-01.zip" ]; then
            unzip -t Gerber_PCB1_2026-08-01.zip
          elif [ -f "hardware/Gerber_PCB1_2026-08-01.zip" ]; then
            unzip -t hardware/Gerber_PCB1_2026-08-01.zip
          else
            echo "Khong tim thay file Gerber!" && exit 1
          fi

      - name: Check Design Project Files
        run: |
          echo "=== Check input ==="
          ls -lh
          echo "Check complete. Ready for PCB!"
